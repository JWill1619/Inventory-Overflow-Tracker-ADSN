# Pilot only: no paid service or database is provisioned by this blueprint.
services:
  - type: web
    name: adsn-overflow-tracker
    runtime: node
    plan: free
    region: frankfurt
    branch: codex/shelves-trial
    buildCommand: npm ci --include=dev && npm run build -- --webpack
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_EXTRA_CA_CERTS
        value: ./certificates/supabase-ca.crt
      - key: ACCESS_MODE
        value: public-login
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
